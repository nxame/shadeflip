name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check tag matches manifest version
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Lint for Firefox
        run: npx -y web-ext@8 lint --source-dir . --ignore-files "site/**" ".github/**" CLAUDE.md README.md

      - name: Build zip
        run: |
          zip -r -X "shadeflip-$VERSION.zip" \
            manifest.json background.js content.js flip.css \
            options.html options.js icons LICENSE

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "shadeflip-$VERSION.zip" \
            --title "Shadeflip $VERSION" --generate-notes
